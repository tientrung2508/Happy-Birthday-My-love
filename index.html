<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Hoàng Thị Huyền Trang ❤️</title>
    <style>
        body {
            margin: 0;
            background: #0d0d0d;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* Màn hình đếm ngược & mở quà */
        #welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        #countdown-box {
            font-size: 5rem;
            font-weight: bold;
            color: #ff4d6d;
            text-shadow: 0 0 25px rgba(255, 77, 109, 0.8);
            animation: pulse 1s infinite;
            margin-bottom: 10px;
        }

        .countdown-title {
            font-size: 1.2rem;
            color: #ffb3c1;
            margin-bottom: 20px;
        }

        #gift-btn {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: zoomIn 0.8s ease-in-out;
        }

        .gift-icon {
            font-size: 85px;
            animation: bounce 1.2s infinite alternate;
            user-select: none;
        }

        .click-hint {
            margin-top: 15px;
            font-size: 1.2rem;
            color: #ff4d6d;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        /* Nội dung chính */
        #main-content {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
        }

        h1 {
            color: #ff4d6d;
            font-size: 1.8rem;
            margin-bottom: 20px;
            text-shadow: 0 0 12px #ff4d6d;
        }

        /* Khung Slide Ảnh To Bự */
        .slider-container {
            position: relative;
            width: 100%;
            max-width: 330px;
            height: 400px;
            margin-bottom: 25px;
            border-radius: 20px;
            overflow: hidden;
            border: 3px solid #ff4d6d;
            box-shadow: 0 0 25px rgba(255, 77, 109, 0.6);
            animation: floatContainer 3s ease-in-out infinite alternate;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.8s ease-in-out, transform 0.8s ease-in-out;
            transform: scale(0.95);
        }

        .slide.active {
            opacity: 1;
            transform: scale(1);
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Dấu chấm chuyển slide */
        .dots-container {
            position: absolute;
            bottom: 12px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 8px;
            z-index: 10;
        }

        .dot {
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active-dot {
            background: #ff4d6d;
            width: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ff4d6d;
        }

        .message-box {
            width: 100%;
            font-size: 1.1rem;
            line-height: 1.8;
            border: 1px solid #ff4d6d;
            padding: 20px;
            border-radius: 15px;
            background: rgba(255, 77, 109, 0.1);
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.2);
            margin-bottom: 25px;
            box-sizing: border-box;
        }

        .gift-box {
            display: none;
            animation: fadeIn 1.5s ease-in-out forwards;
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            border: 1px dashed #ff4d6d;
            width: 100%;
            box-sizing: border-box;
        }

        .heart {
            position: fixed;
            color: #ff4d6d;
            font-size: 20px;
            animation: fall 4s linear infinite;
            z-index: 100;
        }

        /* Animations */
        @keyframes floatContainer {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        @keyframes bounce {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-20px) scale(1.1); }
        }

        @keyframes fall {
            0% { transform: translateY(-100vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes pulse {
            0% { opacity: 0.7; }
            50% { opacity: 1; }
            100% { opacity: 0.7; }
        }
    </style>
</head>
<body>

    <!-- Màn hình Đếm ngược & Nút Mở quà -->
    <div id="welcome-screen">
        <div id="countdown-area">
            <div class="countdown-title">Bất ngờ chuẩn bị xuất hiện sau...</div>
            <div id="countdown-box">10</div>
        </div>

        <div id="gift-btn" onclick="openGift()">
            <div class="gift-icon">🎁</div>
            <div class="click-hint">Chạm vào hộp quà để mở nè Bà xã húi... ❤️</div>
        </div>
    </div>

    <!-- Nhạc nền phát lặp đi lặp lại -->
    <audio id="bg-music" src="nhac.mp3" preload="auto" playsinline loop></audio>

    <!-- Nội dung lời chúc & hình ảnh -->
    <div id="main-content">
        <h1>Chúc Mừng Sinh Nhật<br>Hoàng Thị Huyền Trang! 🎂❤️</h1>

        <!-- Slide Ảnh To Bự -->
        <div class="slider-container">
            <div class="slide active">
                <img src="anh1.JPG?v=4" alt="Ảnh 1" onerror="this.onerror=null; this.src='anh1.jpg?v=4';">
            </div>
            <div class="slide">
                <img src="anh2.JPG?v=4" alt="Ảnh 2" onerror="this.onerror=null; this.src='anh2.jpg?v=4';">
            </div>
            <div class="slide">
                <img src="anh3.JPG?v=4" alt="Ảnh 3" onerror="this.onerror=null; this.src='anh3.jpg?v=4';">
            </div>

            <div class="dots-container">
                <span class="dot active-dot" onclick="setSlide(0)"></span>
                <span class="dot" onclick="setSlide(1)"></span>
                <span class="dot" onclick="setSlide(2)"></span>
            </div>
        </div>

        <div class="message-box">
            <p id="typing-text"></p>
        </div>

        <div id="gift-section" class="gift-box">
            <p style="margin: 0; font-weight: bold; color: #ff758f;">Món quà nhỏ ghép theo mốc sinh nhật 2001/09/07 dành riêng cho em 👇</p>
            <p style="font-size: 1.6rem; font-weight: bold; color: #ffd166; margin: 15px 0;">200.197 VNĐ</p>
            <p style="font-size: 0.9rem; color: #ddd; margin: 0;">Mở app ngân hàng kiểm tra nhé em yêu ❤️</p>
        </div>
    </div>

    <script>
        // Xử lý đếm ngược từ 10 về 0
        let count = 10;
        const countdownBox = document.getElementById("countdown-box");
        const countdownArea = document.getElementById("countdown-area");
        const giftBtn = document.getElementById("gift-btn");

        const timer = setInterval(() => {
            count--;
            if (count > 0) {
                countdownBox.innerText = count;
            } else {
                clearInterval(timer);
                countdownArea.style.display = "none";
                giftBtn.style.display = "flex";
            }
        }, 1000);

        // Lời chúc chạy chữ
        const text = "Chúc mừng sinh nhật Hoàng Thị Huyền Trang - công chúa của anh! Cảm ơn em vì đã đến và làm cho cuộc sống của anh trở nên tuyệt vời hơn mỗi ngày. Chúc em tuổi mới luôn xinh đẹp, rực rỡ và tràn ngập hạnh phúc. Anh có một bất ngờ nhỏ chuẩn bị riêng theo ngày sinh của em ở bên dưới nè... 👇";
        
        const audio = document.getElementById("bg-music");

        audio.addEventListener("ended", function() {
            audio.currentTime = 0;
            audio.play();
        });

        // Xử lý Slide Ảnh
        let currentSlide = 0;
        const slides = document.querySelectorAll('.slide');
        const dots = document.querySelectorAll('.dot');

        function showSlide(index) {
            slides.forEach(s => s.classList.remove('active'));
            dots.forEach(d => d.classList.remove('active-dot'));
            
            slides[index].classList.add('active');
            dots[index].classList.add('active-dot');
            currentSlide = index;
        }

        function setSlide(index) {
            showSlide(index);
        }

        function nextSlide() {
            let next = (currentSlide + 1) % slides.length;
            showSlide(next);
        }

        function openGift() {
            audio.play().catch(function(error) {
                console.log("Audio play error:", error);
            });

            document.getElementById("welcome-screen").style.display = "none";
            document.getElementById("main-content").style.display = "flex";

            // Tự động chuyển slide ảnh ĐÚNG 3 GIÂY (3000ms)
            setInterval(nextSlide, 3000);

            let index = 0;
            function typeWriter() {
                if (index < text.length) {
                    document.getElementById("typing-text").innerHTML += text.charAt(index);
                    index++;
                    setTimeout(typeWriter, 70);
                } else {
                    document.getElementById("gift-section").style.display = "block";
                }
            }
            typeWriter();

            setInterval(createHeart, 300);
        }

        function createHeart() {
            const heart = document.createElement("div");
            heart.classList.add("heart");
            heart.innerHTML = "❤️";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = Math.random() * 2 + 3 + "s";
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 4000);
        }
    </script>
</body>
</html>
